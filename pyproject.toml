[project]
name = "shmotix"
version = "0.1.0"
description = "Экранная лупа-переводчик субтитров: OCR + перевод локальными моделями"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mss>=9",
  "pillow>=10",
  "numpy",
  "rapidocr-onnxruntime>=1.3",
  "argostranslate>=1.9",
]

[project.scripts]
shmotix = "shmotix.app:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
