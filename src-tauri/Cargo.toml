[package]
name = "shmotix"
version = "0.2.0"
edition = "2021"

[lib]
name = "shmotix_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde_json = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.7"
ocrs = "0.10"
rten = "0.21"
ct2rs = { version = "0.9", features = ["sentencepiece"] }

[target.'cfg(target_os = "macos")'.dependencies]
ct2rs = { version = "0.9", features = ["sentencepiece", "accelerate"] }
