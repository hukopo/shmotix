<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Shmotix</title>
<style>
  :root { --cat: 96px; --strip: 0px; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
               font-family: ui-rounded, system-ui, sans-serif; }
  body:not(.overlay) { --strip: 56px; }
  body.nocat { --cat: 0px; }

  /* рамка: еле видимая, скруглённая */
  #lens { position: absolute; left: 0; top: 0; right: var(--cat); bottom: 0; border-radius: 18px;
          border: 1px solid rgba(190, 190, 200, .28); transition: border-color .3s; }
  body:hover #lens { border-color: rgba(190, 190, 200, .6); }
  #hole { position: absolute; inset: 0 0 var(--strip) 0; border-radius: 18px; display: flex;
          align-items: center; justify-content: center; text-align: center; overflow: hidden;
          color: #fff; padding: 4px 14px; box-sizing: border-box; }
  #strip { position: absolute; left: 0; right: 0; bottom: 0; height: var(--strip); border-radius: 16px;
           background: rgba(16, 16, 22, .85); color: #fff; display: flex; align-items: center;
           justify-content: center; text-align: center; padding: 0 16px; box-sizing: border-box; overflow: hidden; }
  body.overlay #strip { display: none; }
  /* режим перекрытия: тёмная плашка поверх оригинальных субтитров, только когда есть перевод */
  body.overlay #hole.on { background: rgba(14, 14, 20, .97); }
  #grip { position: absolute; right: 6px; bottom: 2px; color: rgba(200, 200, 210, .5); cursor: nwse-resize;
          font-size: 13px; }
  body.collapsed #lens { display: none; }

  /* котик */
  #pet { position: absolute; right: 4px; bottom: 2px; width: 87px; height: 102px; cursor: grab; }
  body.nocat #pet { display: none; }
  #pet canvas { width: 87px; height: 102px; image-rendering: pixelated; transform-origin: 50% 100%;
                filter: drop-shadow(1px 0 #f4eee6) drop-shadow(-1px 0 #f4eee6) drop-shadow(0 1px #f4eee6)
                        drop-shadow(0 -1px #f4eee6) drop-shadow(0 2px 3px #0006); }
  .sleep canvas   { animation: breathe 2.6s ease-in-out infinite; }
  .hop canvas     { animation: hop .55s cubic-bezier(.3, 1.8, .5, 1); }
  .stretch canvas { animation: stretch .9s ease-out; }
  .tilt canvas    { animation: tilt 1.4s ease-in-out; }
  .purr canvas    { animation: purr .09s linear 14; }
  .loaf canvas    { animation: loaf 1.4s ease-in-out; }
  .spin canvas    { animation: spin .7s ease-in-out; }
  .zoomies canvas { animation: zoomies 1.3s ease-in-out; }
  .wiggle canvas  { animation: wiggle .5s ease-in-out 2; }
  @keyframes breathe { 50% { transform: scale(1.05, .94); } }
  @keyframes hop     { 40% { transform: translateY(-18px) scale(.94, 1.1); } 80% { transform: scale(1.12, .88); } }
  @keyframes stretch { 30% { transform: scale(1.3, .78); } 65% { transform: scale(.9, 1.14); } }
  @keyframes tilt    { 25%, 75% { transform: rotate(-14deg); } }
  @keyframes purr    { 50% { transform: translateX(1px); } }
  @keyframes loaf    { 30%, 75% { transform: scale(1.18, .8); } }
  @keyframes spin    { to { transform: rotateY(360deg); } }
  @keyframes zoomies { 30% { transform: translateX(-30px) scaleX(-1); } 45% { transform: translateX(-30px) translateY(-10px) scaleX(-1); }
                       70% { transform: translateX(6px); } }
  @keyframes wiggle  { 25% { transform: rotate(6deg); } 75% { transform: rotate(-6deg); } }

  .fx { position: absolute; pointer-events: none; font-weight: 700; white-space: nowrap; animation: float 1.6s ease-out forwards; }
  .zz { color: #cfd8ff; font-size: 13px; text-shadow: 0 0 3px #0008; }
  .heart { color: #ff7aa8; font-size: 16px; text-shadow: 0 0 3px #0006; }
  .bubble { background: #fff; color: #2a2230; font-size: 13px; padding: 4px 10px; border-radius: 14px;
            box-shadow: 0 2px 8px #0005; animation: pop 1.8s ease-out forwards; }
  @keyframes float { 0% { opacity: 0; transform: translate(0, 6px) scale(.6); } 20% { opacity: 1; transform: none; }
                     100% { opacity: 0; transform: translate(-10px, -26px) scale(1.1); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: 1; transform: scale(1.08); }
                   20% { transform: none; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
</style>
</head>
<body class="overlay">
  <div id="lens">
    <div id="hole"><span id="say"></span></div>
    <div id="strip">Наведи рамку на субтитры…</div>
    <span id="grip">◢</span>
  </div>
  <div id="pet" title="тяни — двигать · клик — поиграть · зажми — мяу · двойной клик — свернуть">
    <canvas id="cv" width="29" height="34"></canvas>
  </div>
<script>
  const { event, window: w, dpi, core } = window.__TAURI__;
  const win = w.getCurrentWindow();
  const $ = id => document.getElementById(id);
  const body = document.body, hole = $('hole'), say = $('say'), strip = $('strip'), pet = $('pet');
  const pick = a => a[Math.random() * a.length | 0];

  /* ---------- перевод ---------- */
  let text = '', clearTimer;
  function fit(el, max) {  // уменьшаем шрифт, пока текст не влезет
    let s = max;
    el.style.fontSize = s + 'px';
    while (s > 9 && (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth)) el.style.fontSize = --s + 'px';
  }
  function render() {
    const overlay = body.classList.contains('overlay');
    say.textContent = overlay ? text : '';
    hole.classList.toggle('on', overlay && !!text);
    if (!overlay && text) strip.textContent = text;
    fit(overlay ? hole : strip, overlay ? 34 : 20);
  }
  event.listen('subtitle', e => {
    clearTimeout(clearTimer);
    if (!e.payload) { clearTimer = setTimeout(() => { text = ''; render(); }, 1500); return; } // OCR моргнул — не мигаем
    if (e.payload !== text) { text = e.payload; render(); cheer(); }
  });

  /* ---------- область захвата → Rust ---------- */
  function sendRegion() {
    if (body.classList.contains('collapsed')) return core.invoke('set_region', { x: 0, y: 0, w: 0, h: 0 });
    const r = hole.getBoundingClientRect();
    core.invoke('set_region', { x: r.left, y: r.top, w: r.width, h: r.height });
  }
  addEventListener('resize', () => { render(); sendRegion(); });
  sendRegion();

  event.listen('settings', e => {
    body.classList.toggle('nocat', !e.payload.cat);
    body.classList.toggle('overlay', e.payload.overlay);
    // без котика тащим за саму рамку
    e.payload.cat ? $('lens').removeAttribute('data-tauri-drag-region') : $('lens').setAttribute('data-tauri-drag-region', '');
    if (!e.payload.cat && body.classList.contains('collapsed')) toggleCollapse();
    render(); sendRegion();
  });
  addEventListener('keydown', e => e.key === 'Escape' && win.hide());

  /* ---------- ресайз как прямоугольник в Paint: левый верхний угол окна — якорь ---------- */
  const grip = $('grip');
  grip.onpointerdown = async e => {
    grip.setPointerCapture(e.pointerId);
    const k = await win.scaleFactor();
    const p = (await win.outerPosition()).toLogical(k), s = (await win.innerSize()).toLogical(k);
    // угол окна правее/ниже курсора на ширину котика — сохраняем этот сдвиг
    const dx = p.x + s.width - e.screenX, dy = p.y + s.height - e.screenY;
    grip.onpointermove = ev => {
      const x2 = ev.screenX + dx, y2 = ev.screenY + dy;
      win.setPosition(new dpi.LogicalPosition(Math.min(p.x, x2), Math.min(p.y, y2)));
      win.setSize(new dpi.LogicalSize(Math.max(260, Math.abs(x2 - p.x)), Math.max(100, Math.abs(y2 - p.y))));
    };
  };
  grip.onpointerup = () => { grip.onpointermove = null; };

  /* ---------- свернуть до котика: котик остаётся на месте, окно сжимается вокруг него ---------- */
  const MINI = { w: 230, h: 190 };  // запас слева и сверху под пузырь «мяу»
  let saved = null;
  async function toggleCollapse() {
    const k = await win.scaleFactor();
    const p = (await win.outerPosition()).toLogical(k), s = (await win.innerSize()).toLogical(k);
    if (!saved) {
      saved = { w: s.width, h: s.height };
      body.classList.add('collapsed');
      await win.setSize(new dpi.LogicalSize(MINI.w, MINI.h));
      await win.setPosition(new dpi.LogicalPosition(p.x + s.width - MINI.w, p.y + s.height - MINI.h));
    } else {
      await win.setPosition(new dpi.LogicalPosition(p.x - (saved.w - s.width), p.y - (saved.h - s.height)));
      await win.setSize(new dpi.LogicalSize(saved.w, saved.h));
      saved = null;
      body.classList.remove('collapsed');
      wake();
    }
    sendRegion();
  }

  /* ---------- котик: пиксельные кадры 29×34 (SIT читает scripts/make-cat.py для иконок) ---------- */
  // o контур, # шерсть, W белки, n нос/язык, g тень, . прозрачно
  const SIT = `
.....o............o..........
....o#o..........o#o.........
....o##o........o##o.........
...o###o........o###o........
...o####o......o####o........
...o##o#oooooooo#o##o........
...o###o########o###o........
...o################o........
...o################o........
..o##################o.......
..o###WWW######WWW###o.......
..o##WoooW####WoooW##o.......
.o###WooWW####WooWW###o......
.ooo#WoooW####WoooW#ooo......
..o###WWW##nn##WWW###o.......
.ooo#######o########ooo.oo...
....o#####o#oo#####o...o##o..
.....ooo#########oo....o##o..
....o###o######ooo.....o##o..
...o####o########o.....o##o..
...o###o##########o....o##o..
...o##############o....o##o..
...o######o####o##o...o##o...
....o##o##o####o###o..o##o...
.....oo###o####o###o.o##o....
....o#####o####oo##oo###o....
....o#####o###o#####o##o.....
....o#####o###o#####o#o......
....o#####o##oo#####oo.......
.....o###o###ooo####o........
....o####o###o#####o.........
ggggoooooo##oooooooggggg.....
..gggggggoooogggggggg........
.......gggggggggg............`;
  const rows = m => m.trim().split('\n');
  const edit = (m, patch) => rows(m).map((l, i) => patch[i] ?? l).join('\n');
  const F = {
    sit: SIT,
    blink: edit(SIT, { 10: '..o##################o.......', 11: '..o##################o.......', 12: '.o###ooooo####ooooo###o......', 13: '.ooo################ooo......', 14: '..o########nn########o.......' }),
    sleep: edit(SIT, { 10: '..o##################o.......', 11: '..o##################o.......', 12: '.o###o###o####o###o###o......', 13: '.ooo##ooo######ooo##ooo......', 14: '..o########nn########o.......' }),
    happy: edit(SIT, { 10: '..o##################o.......', 11: '..o####o########o####o.......', 12: '.o####o#o######o#o####o......', 13: '.ooo#o###o####o###o#ooo......', 14: '..o########nn########o.......' }),
    look: edit(SIT, {  }),
    meow: edit(SIT, { 10: '..o##################o.......', 11: '..o####o########o####o.......', 12: '.o####o#o######o#o####o......', 13: '.ooo#o###o####o###o#ooo......', 14: '..o########nn########o.......', 15: '.ooo######ono#######ooo.oo...', 16: '....o#####nnno#####o...o##o..' }),
    lick1: edit(SIT, { 10: '..o##################o.......', 11: '..o####o########o####o.......', 12: '.o####o#o######o#o####o......', 13: '.ooo#o###o####o###o#ooo......', 14: '..o########nn########o.......', 16: '....o#####onoo#####o...o##o..', 17: '.....ooo###n#####oo....o##o..' }),
    lick2: edit(SIT, { 10: '..o##################o.......', 11: '..o####o########o####o.......', 12: '.o####o#o######o#o####o......', 13: '.ooo#o###o####o###o#ooo......', 14: '..o########nn########o.......' }),
    ear: edit(SIT, { 0: '.....o.......................', 1: '....o#o...........o..........', 2: '....o##o.........o#o.........', 3: '...o###o........o##o.........', 4: '...o####o.......o###o........', 5: '...o##o#oooooooo####o........' }),
    tail: edit(SIT, { 15: '.ooo#######o########oo.o.oo..', 16: '....o#####o#oo#####o....o##o.', 17: '.....ooo#########oo.....o##o.', 18: '....o###o######ooo......o##o.', 19: '...o####o########o......o##o.', 20: '...o###o##########o.....o##o.', 21: '...o##############o.....o##o.', 22: '...o######o####o##o....o##o..', 23: '....o##o##o####o###o...o##o..' }),
  };
  const COLORS = { o: '#030303', '#': '#282828', W: '#fff', n: '#f4a0b4', g: 'rgba(0,0,0,.25)' };
  const ctx = $('cv').getContext('2d');
  function draw(name) {
    ctx.clearRect(0, 0, 29, 34);
    rows(F[name]).forEach((row, y) => [...row].forEach((ch, x) => {
      if (COLORS[ch]) { ctx.fillStyle = COLORS[ch]; ctx.fillRect(x, y, 1, 1); }
    }));
  }

  /* ---------- котик: эффекты и действия ---------- */
  function fx(cls, txt, dx = 30, dy = 6) {  // dx — от правого края котика влево
    const el = document.createElement('div');
    el.className = 'fx ' + cls; el.textContent = txt;
    el.style.right = (6 + dx) + 'px'; el.style.bottom = (100 + dy) + 'px';
    body.appendChild(el);
    setTimeout(() => el.remove(), 1900);
  }
  let mood = 'sit', busyUntil = 0, lastPet = Date.now(), tick = 0, timers = [], lastAct = '';
  // act: [[кадр, мс], ...] + css-анимация + эффект в начале
  function act(frames, css, effect) {
    timers.forEach(clearTimeout); timers = [];
    pet.className = ''; void pet.offsetWidth;
    if (css) pet.classList.add(css);
    let t = 0;
    for (const [f, ms] of frames) { timers.push(setTimeout(() => draw(f), t)); t += ms; }
    timers.push(setTimeout(() => { pet.className = ''; draw('sit'); }, t));
    busyUntil = Date.now() + t;
    effect?.();
  }
  const loop = (a, b, n, ms) => Array.from({ length: n * 2 }, (_, i) => [i % 2 ? b : a, ms]);
  const PHRASES = ['мяу!', 'мрр~', 'ня~', 'мур-мур-мур', 'кушать?', 'погладь ещё', 'мяяяяу', 'фрр!', '=^.^=',
                   'я тут главный', 'переведу за вкусняшку', 'ммм… субтитры', 'мяу?', 'не трогай хвост!'];
  const REACTIONS = {
    hop:     () => act([['happy', 550]], 'hop', () => fx('heart', '♥', 20 + Math.random() * 30)),
    tilt:    () => act([['look', 700], ['sit', 300], ['look', 400]], 'tilt', () => fx('bubble', '?', 10)),
    lick:    () => act(loop('lick1', 'lick2', 4, 220), null),
    ear:     () => act(loop('ear', 'sit', 3, 160), 'wiggle'),
    purr:    () => act([['happy', 1300]], 'purr', () => fx('bubble', pick(['мрр~', 'муррр', 'прр-прр']), 10)),
    loaf:    () => act([['blink', 400], ['happy', 1000]], 'loaf', () => fx('zz', '…', 30)),
    spin:    () => act([['happy', 700]], 'spin', () => fx('heart', '✦', 40)),
    zoomies: () => act([['tail', 300], ['sit', 300], ['tail', 300], ['happy', 400]], 'zoomies', () => fx('zz', 'ж-ж-ж!', 50)),
  };
  function react() {  // клик — случайная реакция, не повторяем подряд
    const k = pick(Object.keys(REACTIONS).filter(r => r !== lastAct));
    lastAct = k; REACTIONS[k]();
  }
  function meow() {  // долгое нажатие — мяукает разными фразами
    act([['meow', 260], ['happy', 200], ['meow', 260], ['happy', 400]], 'wiggle', () => fx('bubble', pick(PHRASES), 10));
  }
  function wake() {
    lastPet = Date.now();
    if (mood !== 'sleep') return;
    mood = 'sit';
    act([['blink', 300], ['meow', 500], ['happy', 400]], 'stretch', () => fx('bubble', pick(['мяу~', 'мя?', 'ня!', '*зевает*']), 10));
  }
  let lastCheer = 0;
  function cheer() {  // новый перевод — котик радуется, но не чаще раза в 4 с
    if (mood === 'sleep' || Date.now() < busyUntil || Date.now() - lastCheer < 4000) return;
    lastCheer = Date.now(); REACTIONS.hop();
  }
  setInterval(() => {
    tick++;
    const now = Date.now();
    if (mood === 'sleep') { if (tick % 5 === 0) fx('zz', tick % 10 ? 'z' : 'Z', 10, -20); return; }
    if (now < busyUntil) return;
    if (now - lastPet > (body.classList.contains('collapsed') ? 10000 : 30000)) {
      mood = 'sleep'; pet.className = 'sleep'; draw('sleep'); return;  // задремал
    }
    if (tick % 18 === 0) return pick([REACTIONS.lick, REACTIONS.ear, () => act([['look', 900]])])();  // сам себя развлекает
    draw(Math.random() < .1 ? 'blink' : tick % 2 ? 'tail' : 'sit');
  }, 450);
  draw('sit');

  /* ---------- котик: мышь. Тянуть — двигать окно, клик — играть, зажать — мяу, двойной клик — свернуть ---------- */
  let clickTimer = null;
  pet.onpointerenter = wake;
  pet.onpointerdown = e => {
    wake();
    const sx = e.screenX, sy = e.screenY;
    let dragged = false, held = false;
    const holdTimer = setTimeout(() => { held = true; meow(); }, 500);
    pet.onpointermove = ev => {
      if (!dragged && Math.hypot(ev.screenX - sx, ev.screenY - sy) > 4) {
        dragged = true; clearTimeout(holdTimer); win.startDragging();
      }
    };
    pet.onpointerup = () => {
      pet.onpointermove = pet.onpointerup = null;
      clearTimeout(holdTimer);
      if (dragged || held) return;
      if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; toggleCollapse(); return; }
      clickTimer = setTimeout(() => { clickTimer = null; react(); }, 260);
    };
  };
</script>
</body>
</html>
