<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Shmotix</title>
<style>
  /* BORDER=3px и BAR=60px продублированы в src-tauri/src/lib.rs */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #lens { position: absolute; inset: 0 0 60px 0; border: 3px solid #00c853; border-bottom: 0; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: #111d; color: #fff;
         font: 18px/1.3 system-ui, sans-serif; display: flex; align-items: center; justify-content: center;
         text-align: center; padding: 0 28px; box-sizing: border-box; cursor: move; }
  #grip { position: absolute; right: 2px; bottom: 0; color: #888; cursor: nwse-resize; font-size: 18px; }
  #close { position: absolute; left: 8px; bottom: 38px; color: #00c853; cursor: pointer; font: 16px system-ui; }
</style>
</head>
<body>
  <div id="lens"></div>
  <span id="close" title="Закрыть (Esc)">✕</span>
  <div id="bar" data-tauri-drag-region>Наведи рамку на субтитры…</div>
  <span id="grip">◢</span>
<script>
  const { event, window: w } = window.__TAURI__;
  const win = w.getCurrentWindow();
  const bar = document.getElementById('bar');
  event.listen('subtitle', e => { bar.textContent = e.payload; });
  document.getElementById('grip').onmousedown = () => win.startResizeDragging('SouthEast');
  document.getElementById('close').onclick = () => win.close();
  addEventListener('keydown', e => e.key === 'Escape' && win.close());
</script>
</body>
</html>
